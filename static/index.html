<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高速服务区 · 车主服务与点评</title>
<style>
  :root {
    /* 品牌 */
    --brand: #ff6b35;
    --brand-strong: #f05a24;
    --brand-soft: #fff1ea;
    --brand-700: #e85d2f;
    /* 文本层级 */
    --text-primary: #1f1f1f;
    --text-secondary: #5c5c5c;
    --text-tertiary: #8a8a8a;
    --text-muted: #b5b5b5;
    /* 边框层级（低透明度融入背景） */
    --border-default: rgba(31,31,31,.06);
    --border-subtle: rgba(31,31,31,.04);
    --border-strong: rgba(31,31,31,.12);
    /* 表面（同色相，仅亮度变化） */
    --surface-canvas: #f6f5f3;
    --surface-card: #ffffff;
    --surface-inset: #f4f3f1;
    /* 语义色 */
    --semantic-warning: #f5a623;
    --semantic-danger: #e5484d;
    /* 圆角与间距 */
    --radius-lg: 18px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px;
    --space-4: 16px; --space-5: 20px; --space-6: 24px;
    /* 阴影（subtle，统一深度策略） */
    --shadow-1: 0 1px 2px rgba(31,31,31,.04), 0 1px 3px rgba(31,31,31,.04);
    --shadow-2: 0 2px 8px rgba(31,31,31,.06), 0 1px 2px rgba(31,31,31,.04);
    --shadow-3: 0 8px 24px rgba(31,31,31,.08);
    /* 动效 */
    --ease: cubic-bezier(.25,.1,.25,1);
    --dur: 150ms;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--surface-canvas); color: var(--text-primary); font-size: 14px;
    -webkit-font-smoothing: antialiased; letter-spacing: .01em;
  }
  h1,h2,h3,h4 { font-weight: 700; letter-spacing: -.01em; }
  button { font-family: inherit; }

  /* ---------- 顶部定位栏 ---------- */
  .topbar {
    background: linear-gradient(135deg, var(--brand), #ff8c5a); color: #fff;
    padding: 18px 16px 14px; position: sticky; top: 0; z-index: 20;
    box-shadow: 0 2px 12px rgba(240,90,36,.28);
  }
  .topbar .title { font-size: 18px; font-weight: 800; margin-bottom: 12px; display:flex; align-items:center; gap:6px; }
  .topbar .title a { color:#fff; text-decoration:none; font-size:12px; font-weight:500; margin-left:auto; background:rgba(255,255,255,.2); padding:4px 10px; border-radius:999px; }
  .loc-row { display:flex; gap:8px; align-items:center; }
  .loc-input {
    flex:1; display:flex; align-items:center; gap:6px; background:#fff; color:var(--text-primary);
    border-radius: 12px; padding: 10px 12px; font-size: 13px;
    box-shadow: var(--shadow-1); transition: box-shadow var(--dur) var(--ease);
  }
  .loc-input:focus-within { box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
  .loc-input input { border:none; outline:none; flex:1; font-size:13px; background:transparent; color:var(--text-primary); min-width:0; }
  .loc-input .icon { font-size:16px; }
  .loc-swap { background:rgba(255,255,255,.25); border:none; color:#fff; width:36px; height:36px; border-radius:12px; font-size:15px; cursor:pointer; flex-shrink:0; transition:background var(--dur) var(--ease); }
  .loc-swap:active { background:rgba(255,255,255,.45); }
  .btn-search {
    background:#fff; color:var(--brand); border:none; border-radius:12px;
    padding: 10px 18px; font-weight:800; font-size:14px; cursor:pointer; flex-shrink:0;
    box-shadow: var(--shadow-1); transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .btn-search:active { transform:scale(.97); box-shadow: none; }

  /* ---------- 搜索框 ---------- */
  .search-bar {
    display:flex; align-items:center; gap:8px; background:var(--surface-card);
    border-radius:14px; padding:8px 14px; margin-bottom:4px;
    box-shadow: var(--shadow-1);
  }
  .search-icon { font-size:15px; opacity:.6; }
  .search-bar input {
    flex:1; border:none; outline:none; font-size:14px; background:transparent; color:var(--text-primary); min-width:0;
  }
  .search-bar input::-webkit-input-placeholder { color:var(--text-muted); }
  .btn-search-mini {
    background:var(--brand); color:#fff; border:none; border-radius:10px;
    padding:7px 16px; font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0;
    transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .btn-search-mini:active { transform:scale(.97); background:var(--brand-strong); }

  /* 搜索结果服务区卡片（复用 area-card） */
  .search-area-card {
    background: var(--surface-card); border-radius: var(--radius-md); padding: 16px; margin-bottom: 10px;
    box-shadow: var(--shadow-1); cursor:pointer; transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .search-area-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); }
  .search-area-card h3 { font-size:15px; font-weight:700; margin-bottom:4px; }
  .search-area-card .meta { color:var(--text-secondary); font-size:12px; }
  .search-area-card .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }

  /* ---------- 分类宫格 ---------- */
  .cats {
    background: var(--surface-card); border-radius: var(--radius-lg); margin: 12px 12px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 12px 4px;
    box-shadow: var(--shadow-1);
  }
  .cat { display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px; cursor:pointer; border-radius:12px; transition:background var(--dur) var(--ease); }
  .cat:hover { background: var(--brand-soft); }
  .cat .emoji {
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:22px; background: var(--brand-soft); transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .cat:active .emoji { transform: scale(.92); }
  .cat.active .emoji { background: var(--brand); }
  .cat.active .txt { color: var(--brand); font-weight:700; }
  .cat .txt { font-size:12px; color:var(--text-secondary); }

  /* ---------- 区块 ---------- */
  .container { padding: 0 12px 24px; }
  .section-head { display:flex; align-items:center; gap:6px; margin: 14px 4px 10px; }
  .section-head h2 { font-size:17px; font-weight:800; }
  .section-head .sub { font-size:12px; color:var(--text-tertiary); }
  .section-head .more { margin-left:auto; font-size:12px; color:var(--text-tertiary); }

  /* ---------- 沿途服务区卡片 ---------- */
  .area-card {
    background: var(--surface-card); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 12px;
    box-shadow: var(--shadow-1); cursor:pointer; transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    position: relative; overflow: hidden;
  }
  .area-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); }
  .area-card .dist {
    position:absolute; top:0; right:0; background: var(--brand); color:#fff;
    font-size:11px; padding:4px 14px; border-bottom-left-radius: 12px; font-weight:700;
  }
  .area-card h3 { font-size:16px; font-weight:700; margin-bottom:4px; }
  .area-card .meta { color:var(--text-secondary); font-size:12px; }
  .area-card .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .tag { background:var(--surface-inset); color:var(--text-secondary); font-size:11px; padding:3px 9px; border-radius:999px; }

  /* ---------- 商户详情 ---------- */
  .detail-panel { background:var(--surface-card); border-radius:var(--radius-lg); padding:20px; margin-bottom:12px; box-shadow:var(--shadow-1); }
  .merchant-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border-default); cursor:pointer; }
  .merchant-row:last-child { border-bottom:none; }
  .merchant-name { font-weight:700; font-size:14px; }
  .price { color:var(--brand); font-weight:700; font-size:13px; }
  .stars { color:var(--semantic-warning); letter-spacing:1px; font-size:13px; }
  .review { border-left:3px solid var(--brand); background:var(--surface-inset); padding:10px 12px; border-radius:8px; margin:8px 0; }
  .review .user { font-weight:700; font-size:12px; color:var(--brand); }
  .review .time { font-size:11px; color:var(--text-tertiary); font-weight:400; }
  .reply-box { background:#f2f6ff; border-left:3px solid #4f6df5; border-radius:8px; padding:8px 10px; margin-top:6px; font-size:13px; }
  .btn {
    border:none; border-radius:10px; padding:9px 18px; font-size:14px; font-weight:700; cursor:pointer;
    background:var(--brand); color:#fff; transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .btn:active { transform:scale(.97); background:var(--brand-strong); }
  .btn-ghost { background:var(--surface-inset); color:var(--text-primary); }
  select, input, textarea {
    font-size:13px; padding:9px 12px; border-radius:10px; border:1px solid var(--border-strong); background:#fff;
    font-family:inherit; color:var(--text-primary);
  }
  select:focus, input:focus, textarea:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(255,107,53,.15); }
  textarea { width:100%; resize:vertical; }
  .form-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  .empty { color:var(--text-tertiary); text-align:center; padding:30px; font-size:13px; }
  .back { background:none; border:none; color:var(--text-tertiary); cursor:pointer; font-size:13px; padding:4px 0; }
  .hidden { display:none !important; }
  input::-webkit-input-placeholder { color:var(--text-muted); }

  /* ---------- 底部导航栏 ---------- */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: var(--surface-card); border-top: 1px solid var(--border-default);
    display: flex; justify-content: space-around; align-items: center;
    height: 58px; padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -2px 12px rgba(31,31,31,.05);
  }
  .bottom-nav .nav-item {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer; padding:6px 0; color:var(--text-tertiary); font-size:11px;
    transition: color var(--dur) var(--ease);
  }
  .bottom-nav .nav-item .ni { font-size:20px; }
  .bottom-nav .nav-item.active { color: var(--brand); font-weight:700; }
  .bottom-nav .nav-item:active .ni { transform: scale(.92); }
  .bottom-spacer { height: 78px; }

  /* ---------- 收藏按钮 ---------- */
  .fav-btn {
    display:inline-flex; align-items:center; gap:4px; border:none; cursor:pointer;
    background:var(--surface-inset); color:var(--text-secondary); border-radius:10px; padding:8px 14px; font-size:13px;
    font-weight:600; transition: background var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .fav-btn:active { transform: scale(.95); }
  .fav-btn.on { background:var(--brand-soft); color:var(--brand); }

  /* ---------- 我的页 ---------- */
  .profile-panel { background:var(--surface-card); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow-1); }
  .profile-head { display:flex; align-items:center; gap:14px; }
  .profile-avatar {
    width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,var(--brand),#ff8c5a);
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800;
  }
  .profile-stat { flex:1; display:flex; gap:10px; }
  .p-stat { flex:1; text-align:center; background:var(--surface-inset); border-radius:12px; padding:12px 4px; }
  .p-stat .n { font-size:18px; font-weight:800; }
  .p-stat .l { font-size:11px; color:var(--text-tertiary); margin-top:2px; }
</style>
</head>
<body>

<!-- 顶部定位栏 -->
<div class="topbar">
  <div class="title">
    🛣️ 高速服务区
    <a href="/admin">运营后台 →</a>
  </div>
  <div class="loc-row">
    <div class="loc-input">
      <span class="icon">📍</span>
      <input id="cur" placeholder="当前位置（如 31.23,121.47）" value="31.23,121.47">
    </div>
  </div>
  <div class="loc-row" style="margin-top:8px">
    <div class="loc-input">
      <span class="icon">🚩</span>
      <input id="origin" placeholder="出发地（如 31.23,121.47）" value="31.23,121.47">
    </div>
    <button class="loc-swap" onclick="swapLoc()" title="交换">⇅</button>
    <div class="loc-input">
      <span class="icon">🏁</span>
      <input id="dest" placeholder="目的地（如 39.90,116.40）" value="39.90,116.40">
    </div>
    <button class="btn-search" onclick="loadRoute()">查沿途</button>
  </div>
</div>

<!-- 分类宫格 -->
<div class="cats" id="cats"></div>

<!-- 搜索框 -->
<div class="container" style="padding-top:0">
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input id="search-input" placeholder="搜索服务区：名称 / 高速 / 桩号" onkeyup="onSearchInput(event)">
    <button class="btn-search-mini" onclick="doSearch()">搜索</button>
  </div>
</div>

<div class="container">
  <!-- 搜索结果显示区 -->
  <div id="view-search" class="hidden">
    <div class="section-head">
      <h2>🔍 搜索结果</h2>
      <span class="sub" id="search-sub"></span>
    </div>
    <div id="search-list"></div>
  </div>

  <!-- 沿途服务区 -->
  <div id="view-route">
    <div class="section-head">
      <h2>🚘 沿途服务区</h2>
      <span class="sub" id="route-sub"></span>
    </div>
    <div id="area-list"></div>
  </div>

  <!-- 服务区业态详情 -->
  <div id="view-detail" class="hidden">
    <div class="section-head">
      <button class="back" onclick="backToRoute()">‹ 返回沿途</button>
    </div>
    <div id="detail-body"></div>
  </div>

  <!-- 我的收藏 -->
  <div id="view-favorites" class="hidden">
    <div class="section-head">
      <h2>⭐ 我的收藏</h2>
      <span class="sub" id="fav-sub"></span>
    </div>
    <div id="fav-list"></div>
  </div>

  <!-- 我的 -->
  <div id="view-mine" class="hidden">
    <div class="section-head"><h2>👤 我的</h2></div>
    <div class="profile-panel">
      <div class="profile-head">
        <div class="profile-avatar">👤</div>
        <div style="flex:1">
          <div style="font-size:17px;font-weight:800" id="profile-name">自驾老王</div>
          <div class="meta" style="color:var(--text-tertiary)" id="profile-phone"></div>
        </div>
      </div>
      <div class="profile-stat" style="margin-top:16px">
        <div class="p-stat"><div class="n" id="stat-fav">0</div><div class="l">收藏</div></div>
        <div class="p-stat"><div class="n" id="stat-review">0</div><div class="l">点评</div></div>
        <div class="p-stat"><div class="n" id="stat-coupon">0</div><div class="l">优惠券</div></div>
      </div>
      <div style="margin-top:16px">
        <div class="review-card" style="cursor:pointer" onclick="showFavorites()">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:22px">⭐</span>
            <div><div style="font-weight:700">我的收藏</div><div class="meta" style="color:var(--text-tertiary)">查看收藏的服务区</div></div>
            <span style="margin-left:auto;color:var(--text-tertiary)">›</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 底部导航栏 -->
<div class="bottom-nav">
  <div class="nav-item active" data-nav="home" onclick="switchNav('home')"><span class="ni">🏠</span>首页</div>
  <div class="nav-item" data-nav="search" onclick="focusSearch()"><span class="ni">🔍</span>搜索</div>
  <div class="nav-item" data-nav="fav" onclick="switchNav('fav')"><span class="ni">⭐</span>收藏</div>
  <div class="nav-item" data-nav="mine" onclick="switchNav('mine')"><span class="ni">👤</span>我的</div>
</div>
<div class="bottom-spacer"></div>

<script>
const API = "";
const CATS = [
  {t:"全部", e:"🏠"}, {t:"餐饮", e:"🍜"}, {t:"加油", e:"⛽"},
  {t:"充电", e:"⚡"}, {t:"便利店", e:"🏪"}, {t:"卫生间", e:"🚻"},
  {t:"住宿", e:"🛏️"}, {t:"维修", e:"🔧"},
];
let currentMerchant = null;
let currentUser = 1;
let currentArea = null;
let activeCat = "全部";

async function api(path, opts={}) {
  const res = await fetch(API + path, {headers:{"Content-Type":"application/json"}, ...opts});
  const t = await res.text();
  return t ? JSON.parse(t) : {};
}

// 分类宫格
function renderCats() {
  document.getElementById("cats").innerHTML = CATS.map(c => `
    <div class="cat ${c.t===activeCat?'active':''}" onclick="pickCat('${c.t}')">
      <div class="emoji">${c.e}</div><div class="txt">${c.t}</div>
    </div>`).join("");
}
function pickCat(cat) {
  activeCat = cat;
  renderCats();
  loadRoute(); // 重新加载并按分类展示
}

// 位置交换
function swapLoc() {
  const o = document.getElementById("origin").value;
  document.getElementById("origin").value = document.getElementById("dest").value;
  document.getElementById("dest").value = o;
}

// 沿途服务区
async function loadRoute() {
  const cur = document.getElementById("cur").value.trim() || "31.23,121.47";
  const origin = document.getElementById("origin").value.trim() || cur;
  const dest = document.getElementById("dest").value.trim();
  const [clat, clng] = cur.split(",").map(Number);
  const [dlat, dlng] = dest.split(",").map(Number);
  if (!clat || !dlng) { alert("请填写当前位置和目的地经纬度"); return; }

  document.getElementById("view-route").classList.remove("hidden");
  document.getElementById("view-detail").classList.add("hidden");

  const route = await api(`/route/areas?cur_lat=${clat}&cur_lng=${clng}&dest_lat=${dlat}&dest_lng=${dlng}`);
  document.getElementById("route-sub").textContent = `共 ${route.length} 个 · ${(route.length? route[route.length-1].distance_km : 0)}km 内`;

  const list = document.getElementById("area-list");
  if (!route.length) {
    list.innerHTML = '<div class="empty">暂无沿途服务区，试试调整出发/目的地</div>';
    return;
  }
  // 分类筛选（客户端过滤：全部显示，其他按业态看该服务区是否有对应商户——这里简化为全部展示+高亮分类提示）
  list.innerHTML = route.map((a, i) => {
    const dist = a.distance_km;
    const hint = dist < 30 ? "即将到达" : dist < 100 ? "约" + Math.round(dist/60*60) + "分钟" : "较远";
    return `
    <div class="area-card" onclick="openArea(${a.id})">
      <div class="dist">${dist} km</div>
      <h3>${a.name}</h3>
      <div class="meta">${a.highway} · 桩号 ${a.mile_marker||"-"} · ${hint}</div>
      <div class="meta">${a.description || ""}</div>
      <div class="tags">
        <span class="tag">#餐饮</span><span class="tag">#加油</span><span class="tag">#充电</span><span class="tag">#便利店</span>
      </div>
    </div>`;
  }).join("");
}

// 打开服务区看业态
async function openArea(areaId) {
  currentArea = areaId;
  document.getElementById("view-route").classList.add("hidden");
  document.getElementById("view-detail").classList.remove("hidden");

  const [clat, clng] = (document.getElementById("cur").value||"31.23,121.47").split(",").map(Number);
  const areas = await api("/service-areas");
  const area = areas.find(a => a.id === areaId);
  // 计算该服务区距当前位置距离
  let dist = "";
  if (area && area.latitude) {
    const route = await api(`/route/areas?cur_lat=${clat}&cur_lng=${clng}&dest_lat=${area.latitude}&dest_lng=${area.longitude}`);
    dist = route.length ? route[0].distance_km + " km" : "附近";
  }

  const ms = await api(`/merchants?service_area_id=${areaId}`);
  document.getElementById("detail-body").innerHTML = `
    <div class="detail-panel">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
        <div>
          <h3 style="font-size:17px;font-weight:800">${area?area.name:""}</h3>
          <div class="meta" style="color:var(--text-tertiary);font-size:12px;margin-top:4px">${area?area.highway:""} · 距当前约 ${dist}</div>
        </div>
        <button class="fav-btn" id="detail-fav-btn" onclick="toggleFavorite(${areaId}, this)">♡ 收藏</button>
      </div>
      ${area && area.description ? `<div class="meta" style="margin-top:6px;color:var(--text-secondary)">${area.description}</div>` : ""}
    </div>
    <div class="section-head"><h2>业态商户</h2><span class="sub">${ms.length} 家</span></div>
    <div class="detail-panel">
      ${ms.length ? ms.map(m => `
        <div class="merchant-row" onclick="showMerchant(${m.id})">
          <div>
            <div class="merchant-name">${m.name}</div>
            <div style="margin-top:4px">
              <span class="tag">${m.category}</span>
              <span class="tag">${m.open_hours||"营业中"}</span>
            </div>
          </div>
          <div style="text-align:right">
            <div class="stars">${"★".repeat(Math.round(m.rating))}${"☆".repeat(5-Math.round(m.rating))}</div>
            <div style="font-size:11px;color:var(--text-tertiary)">${m.rating.toFixed(1)}分 · ${m.review_count}条</div>
            ${m.avg_price? `<div class="price">¥${m.avg_price} 起</div>`:""}
          </div>
        </div>`).join("") : '<div class="empty">该服务区暂无商户</div>'}
    </div>`;
}

// 商户详情 + 点评
async function showMerchant(id) {
  const m = await api(`/merchants/${id}`);
  currentMerchant = m;
  const reviews = await api(`/reviews?merchant_id=${id}`);
  const el = document.getElementById("detail-body");
  el.innerHTML = `
    <div class="detail-panel">
      <h3 style="font-size:17px;font-weight:800">${m.name}</h3>
      <div class="meta" style="color:var(--text-tertiary);font-size:12px;margin-top:4px">${m.category} · ${m.open_hours||""} · ${m.rating.toFixed(1)}分</div>
      <div class="meta" style="margin-top:6px;color:var(--text-secondary)">${m.description||"暂无简介"}</div>
      <div style="margin-top:12px">
        <div style="font-weight:700;margin-bottom:6px">💬 ${reviews.length} 条点评</div>
        ${reviews.length ? reviews.map(r => `
          <div class="review">
            <div><span class="stars">${"★".repeat(r.rating)}</span>
              <span class="user">${r.user_nickname||"匿名"}</span>
              <span class="time">${(r.created_at||"").slice(0,16)}</span>
            </div>
            <div style="margin:4px 0">${r.content||""}</div>
            ${r.tags? `<div style="font-size:11px;color:var(--brand)">${r.tags.split(",").map(t=>"#"+t).join(" ")}</div>`:""}
            ${r.merchant_reply? `<div class="reply-box"><b>商家回复</b>：${r.merchant_reply}</div>`:""}
          </div>`).join("") : '<div class="empty">还没有点评，来抢沙发~</div>'}
      </div>
      <div style="margin-top:14px">
        <div style="font-weight:700">发表点评</div>
        <div class="form-row">
          <select id="new-rating">
            <option value="5">★★★★★</option><option value="4">★★★★</option>
            <option value="3">★★★</option><option value="2">★★</option><option value="1">★</option>
          </select>
          <input id="new-tags" placeholder="标签，逗号分隔" style="flex:1;min-width:120px">
        </div>
        <textarea id="new-content" rows="2" placeholder="说说你的体验..."></textarea>
        <div class="form-row">
          <button class="btn" onclick="submitReview()">提交点评</button>
          <button class="btn btn-ghost" onclick="openArea(${currentArea})">返回业态</button>
        </div>
      </div>
    </div>`;
}

async function submitReview() {
  if (!currentMerchant) return;
  const rating = parseInt(document.getElementById("new-rating").value);
  const content = document.getElementById("new-content").value;
  const tags = document.getElementById("new-tags").value;
  if (!content.trim()) { alert("请填写点评内容"); return; }
  await api("/reviews", {method:"POST", body: JSON.stringify({
    merchant_id: currentMerchant.id, user_id: currentUser, rating, content, tags
  })});
  alert("点评已提交，审核通过后展示");
  showMerchant(currentMerchant.id);
}

function backToRoute() {
  document.getElementById("view-detail").classList.add("hidden");
  document.getElementById("view-search").classList.add("hidden");
  document.getElementById("view-route").classList.remove("hidden");
}

// ---------- 搜索服务区 ----------
function onSearchInput(e) {
  if (e.key === "Enter") doSearch();
}

async function doSearch() {
  const q = document.getElementById("search-input").value.trim();
  if (!q) { alert("请输入搜索关键词"); return; }
  const results = await api(`/service-areas/search?q=${encodeURIComponent(q)}`);

  document.getElementById("view-search").classList.remove("hidden");
  document.getElementById("view-route").classList.add("hidden");
  document.getElementById("view-detail").classList.add("hidden");
  document.getElementById("search-sub").textContent = `“${q}” 找到 ${results.length} 个`;

  const list = document.getElementById("search-list");
  if (!results.length) {
    list.innerHTML = '<div class="empty">未找到相关服务区，试试其他关键词</div>';
    return;
  }
  list.innerHTML = results.map(a => `
    <div class="search-area-card" onclick="openArea(${a.id})">
      <h3>${a.name}</h3>
      <div class="meta">${a.highway} · 桩号 ${a.mile_marker||"-"}</div>
      ${a.description ? `<div class="meta">${a.description}</div>` : ""}
      <div class="tags">
        <span class="tag">${a.merchant_count} 家商户</span>
        <span class="tag">⭐ ${a.avg_rating.toFixed(1)}</span>
        ${(a.categories||[]).map(c=>`<span class="tag">${c}</span>`).join("")}
      </div>
    </div>`).join("");
}

// ---------- 底部导航 ----------
function setNav(active) {
  document.querySelectorAll(".bottom-nav .nav-item").forEach(n =>
    n.classList.toggle("active", n.dataset.nav === active));
}
function hideAllViews() {
  ["view-route","view-search","view-detail","view-favorites","view-mine"].forEach(v =>
    document.getElementById(v).classList.add("hidden"));
}
function switchNav(name) {
  if (name === "home") { hideAllViews(); document.getElementById("view-route").classList.remove("hidden"); setNav("home"); }
  else if (name === "fav") { hideAllViews(); document.getElementById("view-favorites").classList.remove("hidden"); loadFavorites(); setNav("fav"); }
  else if (name === "mine") { hideAllViews(); document.getElementById("view-mine").classList.remove("hidden"); loadMine(); setNav("mine"); }
  else if (name === "search") { focusSearch(); }
}
function focusSearch() {
  hideAllViews(); document.getElementById("view-search").classList.remove("hidden");
  document.getElementById("search-input").focus(); setNav("search");
  document.getElementById("search-list").innerHTML = '<div class="empty">输入关键词搜索沿途服务区</div>';
  document.getElementById("search-sub").textContent = "";
}
function backToRoute() { switchNav("home"); }

// ---------- 收藏 ----------
async function toggleFavorite(areaId, btn) {
  const r = await api("/favorites/toggle", {method:"POST", body: JSON.stringify({
    user_id: currentUser, area_id: areaId
  })});
  if (btn) {
    btn.classList.toggle("on", r.favorited);
    btn.textContent = r.favorited ? "♥ 已收藏" : "♡ 收藏";
  }
  return r;
}
async function loadFavorites() {
  const favs = await api(`/favorites?user_id=${currentUser}`);
  document.getElementById("fav-sub").textContent = `${favs.length} 个`;
  const list = document.getElementById("fav-list");
  if (!favs.length) { list.innerHTML = '<div class="empty">还没有收藏，去首页逛逛吧~</div>'; return; }
  list.innerHTML = favs.map(a => `
    <div class="search-area-card" onclick="openArea(${a.id})">
      <h3>${a.name}</h3>
      <div class="meta">${a.highway} · 桩号 ${a.mile_marker||"-"}</div>
      <div class="tags">
        <span class="tag">${a.merchant_count} 家商户</span>
        <span class="tag">⭐ ${(a.avg_rating||0).toFixed(1)}</span>
      </div>
      <button class="fav-btn on" style="margin-top:10px" onclick="event.stopPropagation();toggleFavorite(${a.id}, this).then(()=>loadFavorites())">♥ 已收藏</button>
    </div>`).join("");
}
function showFavorites() { switchNav("fav"); }

// ---------- 我的页 ----------
async function loadMine() {
  // 用户信息
  const u = await api(`/users/${currentUser}`).catch(() => ({nickname:"自驾老王"}));
  document.getElementById("profile-name").textContent = u.nickname || "自驾老王";
  document.getElementById("profile-phone").textContent = u.phone ? `📱 ${u.phone}` : "";
  // 收藏数
  const favs = await api(`/favorites?user_id=${currentUser}`);
  document.getElementById("stat-fav").textContent = favs.length;
  // 点评数（统计当前用户所有点评 —— 通过全部点评过滤）
  const all = await api("/reviews/all");
  const mineRevs = all.filter(r => r.user_id === currentUser);
  document.getElementById("stat-review").textContent = mineRevs.length;
  // 优惠券数
  const coupons = await api(`/users/me/coupons?user_id=${currentUser}`);
  document.getElementById("stat-coupon").textContent = coupons.length;
}

renderCats();
loadRoute();
</script>
</body>
