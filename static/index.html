<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高速服务区 · 车主服务与点评</title>
<style>
  :root {
    --primary: #ff6b35;       /* 美团橙 */
    --primary-dark: #e85d2f;
    --ink: #222;
    --ink-2: #666;
    --line: #f0f0f0;
    --bg: #f5f5f5;
    --card: #fff;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }

  /* ---------- 顶部定位栏 ---------- */
  .topbar {
    background: linear-gradient(135deg, #ff6b35, #ff8c5a); color: #fff;
    padding: 18px 16px 14px; position: sticky; top: 0; z-index: 20;
    box-shadow: 0 2px 10px rgba(255,107,53,.25);
  }
  .topbar .title { font-size: 18px; font-weight: 800; margin-bottom: 12px; display:flex; align-items:center; gap:6px; }
  .topbar .title a { color:#fff; text-decoration:none; font-size:12px; font-weight:500; margin-left:auto; background:rgba(255,255,255,.2); padding:4px 10px; border-radius:999px; }
  .loc-row { display:flex; gap:8px; align-items:center; }
  .loc-input {
    flex:1; display:flex; align-items:center; gap:6px; background:#fff; color:var(--ink);
    border-radius: 10px; padding: 10px 12px; font-size: 13px;
  }
  .loc-input input { border:none; outline:none; flex:1; font-size:13px; background:transparent; color:var(--ink); min-width:0; }
  .loc-input .icon { font-size:16px; }
  .loc-swap { background:rgba(255,255,255,.25); border:none; color:#fff; width:36px; height:36px; border-radius:10px; font-size:15px; cursor:pointer; flex-shrink:0; }
  .btn-search {
    background:#fff; color:var(--primary); border:none; border-radius:10px;
    padding: 10px 18px; font-weight:800; font-size:14px; cursor:pointer; flex-shrink:0;
    box-shadow: 0 2px 6px rgba(0,0,0,.1);
  }
  .btn-search:active { transform:scale(.97); }

  /* ---------- 分类宫格 ---------- */
  .cats {
    background: var(--card); border-radius: var(--radius); margin: 12px 12px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 12px 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .cat { display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px; cursor:pointer; border-radius:10px; transition:background .15s; }
  .cat:hover { background:#fff5f0; }
  .cat .emoji {
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:22px; background:#fff3ec;
  }
  .cat.active .emoji { background: var(--primary); }
  .cat.active .txt { color: var(--primary); font-weight:700; }
  .cat .txt { font-size:12px; color:var(--ink-2); }

  /* ---------- 区块 ---------- */
  .container { padding: 0 12px 24px; }
  .section-head { display:flex; align-items:center; gap:6px; margin: 14px 4px 10px; }
  .section-head h2 { font-size:16px; font-weight:800; }
  .section-head .sub { font-size:12px; color:var(--ink-2); }
  .section-head .more { margin-left:auto; font-size:12px; color:var(--ink-2); }

  /* ---------- 沿途服务区卡片 ---------- */
  .area-card {
    background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05); cursor:pointer; transition: transform .15s;
    position: relative; overflow: hidden;
  }
  .area-card:hover { transform: translateY(-1px); }
  .area-card .dist {
    position:absolute; top:0; right:0; background: var(--primary); color:#fff;
    font-size:11px; padding:3px 12px; border-bottom-left-radius: 10px; font-weight:700;
  }
  .area-card h3 { font-size:15px; font-weight:700; margin-bottom:4px; }
  .area-card .meta { color:var(--ink-2); font-size:12px; }
  .area-card .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .tag { background:#f0f0f0; color:var(--ink-2); font-size:11px; padding:2px 8px; border-radius:999px; }

  /* ---------- 商户详情 ---------- */
  .detail-panel { background:var(--card); border-radius:var(--radius); padding:18px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .merchant-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .merchant-row:last-child { border-bottom:none; }
  .merchant-name { font-weight:700; font-size:14px; }
  .price { color:var(--primary); font-weight:700; font-size:13px; }
  .stars { color:#f5a623; letter-spacing:1px; font-size:13px; }
  .review { border-left:3px solid var(--primary); background:#fafafa; padding:10px 12px; border-radius:6px; margin:8px 0; }
  .review .user { font-weight:700; font-size:12px; color:var(--primary); }
  .review .time { font-size:11px; color:#999; font-weight:400; }
  .reply-box { background:#f2f6ff; border-left:3px solid #4f6df5; border-radius:6px; padding:8px 10px; margin-top:6px; font-size:13px; }
  .btn {
    border:none; border-radius:9px; padding:9px 18px; font-size:14px; font-weight:700; cursor:pointer;
    background:var(--primary); color:#fff; transition:all .15s;
  }
  .btn:active { transform:scale(.97); }
  .btn-ghost { background:#f0f0f0; color:var(--ink); }
  select, input, textarea {
    font-size:13px; padding:9px 12px; border-radius:9px; border:1px solid #ddd; background:#fff;
    font-family:inherit;
  }
  textarea { width:100%; resize:vertical; }
  .form-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  .empty { color:#999; text-align:center; padding:30px; font-size:13px; }
  .back { background:none; border:none; color:var(--ink-2); cursor:pointer; font-size:13px; padding:4px 0; }
  .hidden { display:none !important; }
  input::-webkit-input-placeholder { color:#bbb; }
</style>
</head>
<body>

<!-- 顶部定位栏 -->
<div class="topbar">
  <div class="title">
    🛣️ 高速服务区
    <a href="/admin">运营后台 →</a>
  </div>
  <div class="loc-row">
    <div class="loc-input">
      <span class="icon">📍</span>
      <input id="cur" placeholder="当前位置（如 31.23,121.47）" value="31.23,121.47">
    </div>
  </div>
  <div class="loc-row" style="margin-top:8px">
    <div class="loc-input">
      <span class="icon">🚩</span>
      <input id="origin" placeholder="出发地（如 31.23,121.47）" value="31.23,121.47">
    </div>
    <button class="loc-swap" onclick="swapLoc()" title="交换">⇅</button>
    <div class="loc-input">
      <span class="icon">🏁</span>
      <input id="dest" placeholder="目的地（如 39.90,116.40）" value="39.90,116.40">
    </div>
    <button class="btn-search" onclick="loadRoute()">查沿途</button>
  </div>
</div>

<!-- 分类宫格 -->
<div class="cats" id="cats"></div>

<div class="container">
  <!-- 沿途服务区 -->
  <div id="view-route">
    <div class="section-head">
      <h2>🚘 沿途服务区</h2>
      <span class="sub" id="route-sub"></span>
    </div>
    <div id="area-list"></div>
  </div>

  <!-- 服务区业态详情 -->
  <div id="view-detail" class="hidden">
    <div class="section-head">
      <button class="back" onclick="backToRoute()">‹ 返回沿途</button>
    </div>
    <div id="detail-body"></div>
  </div>
</div>

<script>
const API = "";
const CATS = [
  {t:"全部", e:"🏠"}, {t:"餐饮", e:"🍜"}, {t:"加油", e:"⛽"},
  {t:"充电", e:"⚡"}, {t:"便利店", e:"🏪"}, {t:"卫生间", e:"🚻"},
  {t:"住宿", e:"🛏️"}, {t:"维修", e:"🔧"},
];
let currentMerchant = null;
let currentUser = 1;
let currentArea = null;
let activeCat = "全部";

async function api(path, opts={}) {
  const res = await fetch(API + path, {headers:{"Content-Type":"application/json"}, ...opts});
  const t = await res.text();
  return t ? JSON.parse(t) : {};
}

// 分类宫格
function renderCats() {
  document.getElementById("cats").innerHTML = CATS.map(c => `
    <div class="cat ${c.t===activeCat?'active':''}" onclick="pickCat('${c.t}')">
      <div class="emoji">${c.e}</div><div class="txt">${c.t}</div>
    </div>`).join("");
}
function pickCat(cat) {
  activeCat = cat;
  renderCats();
  loadRoute(); // 重新加载并按分类展示
}

// 位置交换
function swapLoc() {
  const o = document.getElementById("origin").value;
  document.getElementById("origin").value = document.getElementById("dest").value;
  document.getElementById("dest").value = o;
}

// 沿途服务区
async function loadRoute() {
  const cur = document.getElementById("cur").value.trim() || "31.23,121.47";
  const origin = document.getElementById("origin").value.trim() || cur;
  const dest = document.getElementById("dest").value.trim();
  const [clat, clng] = cur.split(",").map(Number);
  const [dlat, dlng] = dest.split(",").map(Number);
  if (!clat || !dlng) { alert("请填写当前位置和目的地经纬度"); return; }

  document.getElementById("view-route").classList.remove("hidden");
  document.getElementById("view-detail").classList.add("hidden");

  const route = await api(`/route/areas?cur_lat=${clat}&cur_lng=${clng}&dest_lat=${dlat}&dest_lng=${dlng}`);
  document.getElementById("route-sub").textContent = `共 ${route.length} 个 · ${(route.length? route[route.length-1].distance_km : 0)}km 内`;

  const list = document.getElementById("area-list");
  if (!route.length) {
    list.innerHTML = '<div class="empty">暂无沿途服务区，试试调整出发/目的地</div>';
    return;
  }
  // 分类筛选（客户端过滤：全部显示，其他按业态看该服务区是否有对应商户——这里简化为全部展示+高亮分类提示）
  list.innerHTML = route.map((a, i) => {
    const dist = a.distance_km;
    const hint = dist < 30 ? "即将到达" : dist < 100 ? "约" + Math.round(dist/60*60) + "分钟" : "较远";
    return `
    <div class="area-card" onclick="openArea(${a.id})">
      <div class="dist">${dist} km</div>
      <h3>${a.name}</h3>
      <div class="meta">${a.highway} · 桩号 ${a.mile_marker||"-"} · ${hint}</div>
      <div class="meta">${a.description || ""}</div>
      <div class="tags">
        <span class="tag">#餐饮</span><span class="tag">#加油</span><span class="tag">#充电</span><span class="tag">#便利店</span>
      </div>
    </div>`;
  }).join("");
}

// 打开服务区看业态
async function openArea(areaId) {
  currentArea = areaId;
  document.getElementById("view-route").classList.add("hidden");
  document.getElementById("view-detail").classList.remove("hidden");

  const [clat, clng] = (document.getElementById("cur").value||"31.23,121.47").split(",").map(Number);
  const areas = await api("/service-areas");
  const area = areas.find(a => a.id === areaId);
  // 计算该服务区距当前位置距离
  let dist = "";
  if (area && area.latitude) {
    const route = await api(`/route/areas?cur_lat=${clat}&cur_lng=${clng}&dest_lat=${area.latitude}&dest_lng=${area.longitude}`);
    dist = route.length ? route[0].distance_km + " km" : "附近";
  }

  const ms = await api(`/merchants?service_area_id=${areaId}`);
  document.getElementById("detail-body").innerHTML = `
    <div class="detail-panel">
      <h3 style="font-size:17px;font-weight:800">${area?area.name:""}</h3>
      <div class="meta" style="color:#999;font-size:12px;margin-top:4px">${area?area.highway:""} · 距当前约 ${dist}</div>
      ${area && area.description ? `<div class="meta" style="margin-top:6px;color:#666">${area.description}</div>` : ""}
    </div>
    <div class="section-head"><h2>业态商户</h2><span class="sub">${ms.length} 家</span></div>
    <div class="detail-panel">
      ${ms.length ? ms.map(m => `
        <div class="merchant-row" onclick="showMerchant(${m.id})">
          <div>
            <div class="merchant-name">${m.name}</div>
            <div style="margin-top:4px">
              <span class="tag">${m.category}</span>
              <span class="tag">${m.open_hours||"营业中"}</span>
            </div>
          </div>
          <div style="text-align:right">
            <div class="stars">${"★".repeat(Math.round(m.rating))}${"☆".repeat(5-Math.round(m.rating))}</div>
            <div style="font-size:11px;color:#999">${m.rating.toFixed(1)}分 · ${m.review_count}条</div>
            ${m.avg_price? `<div class="price">¥${m.avg_price} 起</div>`:""}
          </div>
        </div>`).join("") : '<div class="empty">该服务区暂无商户</div>'}
    </div>`;
}

// 商户详情 + 点评
async function showMerchant(id) {
  const m = await api(`/merchants/${id}`);
  currentMerchant = m;
  const reviews = await api(`/reviews?merchant_id=${id}`);
  const el = document.getElementById("detail-body");
  el.innerHTML = `
    <div class="detail-panel">
      <h3 style="font-size:17px;font-weight:800">${m.name}</h3>
      <div class="meta" style="color:#999;font-size:12px;margin-top:4px">${m.category} · ${m.open_hours||""} · ${m.rating.toFixed(1)}分</div>
      <div class="meta" style="margin-top:6px;color:#666">${m.description||"暂无简介"}</div>
      <div style="margin-top:12px">
        <div style="font-weight:700;margin-bottom:6px">💬 ${reviews.length} 条点评</div>
        ${reviews.length ? reviews.map(r => `
          <div class="review">
            <div><span class="stars">${"★".repeat(r.rating)}</span>
              <span class="user">${r.user_nickname||"匿名"}</span>
              <span class="time">${(r.created_at||"").slice(0,16)}</span>
            </div>
            <div style="margin:4px 0">${r.content||""}</div>
            ${r.tags? `<div style="font-size:11px;color:#e85d2f">${r.tags.split(",").map(t=>"#"+t).join(" ")}</div>`:""}
            ${r.merchant_reply? `<div class="reply-box"><b>商家回复</b>：${r.merchant_reply}</div>`:""}
          </div>`).join("") : '<div class="empty">还没有点评，来抢沙发~</div>'}
      </div>
      <div style="margin-top:14px">
        <div style="font-weight:700">发表点评</div>
        <div class="form-row">
          <select id="new-rating">
            <option value="5">★★★★★</option><option value="4">★★★★</option>
            <option value="3">★★★</option><option value="2">★★</option><option value="1">★</option>
          </select>
          <input id="new-tags" placeholder="标签，逗号分隔" style="flex:1;min-width:120px">
        </div>
        <textarea id="new-content" rows="2" placeholder="说说你的体验..."></textarea>
        <div class="form-row">
          <button class="btn" onclick="submitReview()">提交点评</button>
          <button class="btn btn-ghost" onclick="openArea(${currentArea})">返回业态</button>
        </div>
      </div>
    </div>`;
}

async function submitReview() {
  if (!currentMerchant) return;
  const rating = parseInt(document.getElementById("new-rating").value);
  const content = document.getElementById("new-content").value;
  const tags = document.getElementById("new-tags").value;
  if (!content.trim()) { alert("请填写点评内容"); return; }
  await api("/reviews", {method:"POST", body: JSON.stringify({
    merchant_id: currentMerchant.id, user_id: currentUser, rating, content, tags
  })});
  alert("点评已提交，审核通过后展示");
  showMerchant(currentMerchant.id);
}

function backToRoute() {
  document.getElementById("view-detail").classList.add("hidden");
  document.getElementById("view-route").classList.remove("hidden");
}

renderCats();
loadRoute();
</script>
</body>
</html>
